name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite runs entirely on the in-memory PersistenceStore and InMemoryStreamBus
      # ports, so no Postgres or Redis service containers are needed. Keep it that way —
      # if a test ever needs a live database, add a separate job rather than slowing
      # this one down.
      - name: Test
        run: bun test

      - name: Type check
        run: bun run check-types

      - name: Validate docker-compose
        run: docker compose config --quiet
